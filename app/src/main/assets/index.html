<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electrical Shop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;
  --acc:#1e40af;--acc2:#1e3a8a;--accs:#e8eefc;--yel:#facc15;
  --ok:#15803d;--oks:#e6f4ea;--warn:#b45309;--warns:#fdf3e1;--bad:#b91c1c;--bads:#fbe9e9;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--acc2);color:#fff;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--yel);color:var(--acc2);display:grid;place-items:center;font-size:16px}
.sync{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.sync.live i{background:#4ade80}.sync.local i{background:#fbbf24}
nav.side{background:#fff;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:54px;height:calc(100vh - 54px)}
nav.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;position:relative}
nav.side a svg{width:20px;height:20px;flex:none}
nav.side a.on{background:var(--accs);color:var(--acc)}
nav.side a.cta{background:var(--acc);color:#fff;margin:4px 0}
nav.side a .badge{margin-left:auto}
main{padding:20px 22px 100px;max-width:1200px;width:100%;min-width:0}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mute);font-size:13px;margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:22px;letter-spacing:-.4px;margin-top:2px}
.kpi span{font-size:12px;color:var(--mute);font-weight:600}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:11px;font-weight:700;font-size:14px;background:#fff;border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#eef2f7;color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.warn{background:var(--warns);color:var(--warn)}.pill.bad{background:var(--bads);color:var(--bad)}.pill.blue{background:var(--accs);color:var(--acc)}
.badge{background:#dc2626;color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px;min-width:20px;text-align:center}
.list>*+*{border-top:1px solid var(--line)}
.li{padding:11px 2px;display:flex;gap:10px;align-items:center}
.li.tap{cursor:pointer}
.li .t{font-weight:700}
.m{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:26px 10px;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:6px}
.qa button small{color:var(--mute);font-weight:500;font-size:12px}
.qa button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.qa button.p small{color:#c7d4f5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--mute)}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:15px;color:var(--ink)}
.in:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.amt-red{color:var(--bad);font-weight:800}.amt-green{color:var(--ok);font-weight:800}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tb td{padding:10px 6px;border-bottom:1px solid var(--line)}
table.tb td.n,table.tb th.n{text-align:right}
table.tb tr.tap{cursor:pointer}
table.tb tr.tap:hover td{background:#f8fafc}
/* POS sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.sh-head .ttl{font-weight:800;font-size:16px}
.sh-body{flex:1;display:grid;grid-template-columns:1fr 400px;min-height:0}
.pane{overflow:auto;padding:14px;min-height:0}
.cart-pane{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:0}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:88px;position:relative}
.item:active{transform:scale(.98)}
.item .nm{font-weight:700;font-size:14px;line-height:1.25}
.item .pr{margin-top:auto;font-weight:800;color:var(--acc)}
.item .st{font-size:11.5px;color:var(--mute);font-weight:600}
.item .st.lo{color:var(--bad)}
.item .q{position:absolute;top:8px;right:8px}
.custbar{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.lines{flex:1;overflow:auto;padding:4px 14px}
.line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{flex:1;font-weight:600;font-size:14px;cursor:pointer}
.line .nm small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:30px;font-weight:800;font-size:16px;color:var(--acc)}
.qty span{min-width:30px;text-align:center;font-weight:800;font-size:13.5px}
.line .amt{width:70px;text-align:right;font-weight:700}
.tot{padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px}
.tot .r{display:flex;justify-content:space-between;padding:2px 0;color:var(--mute)}
.tot .r.big{color:var(--ink);font-size:20px;font-weight:800;padding-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.mtabs{display:none}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:18px}
.modal-box h2{font-size:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.paymodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paymodes button{padding:14px 8px;border:2px solid var(--line);border-radius:12px;font-weight:800}
.paymodes button.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
.bigtotal{font-size:34px;font-weight:800;letter-spacing:-1px;text-align:center;margin:6px 0 14px}
.rc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#fffef9;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;color:#222}
.rc .c{text-align:center}.rc h3{margin:0 0 2px;font-size:15px}
.rc hr{border:0;border-top:1px dashed #aaa;margin:8px 0}
.rc table{width:100%;border-collapse:collapse}.rc td{padding:2px 0;vertical-align:top}
.rc td.n{text-align:right;white-space:nowrap;padding-left:6px}.rc .big td{font-weight:800;font-size:14px}
.steps{display:flex;gap:4px;margin:8px 0}
.steps span{flex:1;height:5px;border-radius:3px;background:#e2e8f0}
.steps span.on{background:var(--acc)}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;justify-content:space-around}
  nav.side a{flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;flex:1;text-align:center}
  nav.side a.cta{margin:0 2px;border-radius:12px}
  nav.side a .badge{position:absolute;top:0;right:calc(50% - 22px);margin:0;font-size:10px;padding:0 5px}
  main{padding:16px 14px 100px}
  .sh-body{grid-template-columns:1fr}
  .sheet .menu-pane,.sheet .cart-pane{display:none}
  .sheet.t-menu .menu-pane{display:block}
  .sheet.t-cart .cart-pane{display:flex;border-left:0}
  .mtabs{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .mtabs .btn{flex:1}
  .items{grid-template-columns:repeat(2,1fr)}
  .fg{grid-template-columns:1fr}
  .modal{align-items:flex-end;padding:0}
  .modal-box{border-radius:18px 18px 0 0;max-height:92vh}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">⚡</span><span id="brandName">Electrical Shop</span></div>
    <div class="sync" id="sync"><i></i><span>Connecting…</span></div>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="view"></main>
</div>
<div id="pos" class="sheet hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="mbox"></div></div>
<div id="toast" class="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dayKey(d)};
const r2=n=>Math.round((n||0)*100)/100;
const inr=n=>'₹'+r2(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const inr2=n=>r2(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const tm=ts=>new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
const dt=ts=>new Date(ts).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const prettyDay=k=>new Date(k+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const phoneWA=p=>{const d=String(p||'').replace(/\D/g,'');return d.length===10?'91'+d:d};
const fq=q=>(Math.round(q*100)/100).toString();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)}
const ICONS={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 stock:'<path d="M3 8l9-5 9 5-9 5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',
 khata:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/>',
 repairs:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
 reports:'<path d="M5 20V11M12 20V5M19 20v-6"/>',
 setup:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'
};
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

/* ---------- state & storage ---------- */
const DEFAULTS={name:'My Electrical Shop',address:'',phone:'',gstin:'',footer:'Thank you! Goods once sold will not be taken back.',upi:''};
const COLS=['products','customers','bills','ledger','repairs'];
const S={products:new Map(),customers:new Map(),bills:new Map(),ledger:new Map(),repairs:new Map(),settings:{...DEFAULTS}};
let db=null,downloads=null,mode='loading';
const subs={},chains={};
function queue(key,fn){const p=(chains[key]||Promise.resolve()).then(fn,fn);chains[key]=p.catch(()=>{});return p}
const clean=o=>JSON.parse(JSON.stringify(o));
const NATIVE=window.AndroidBridge||null;
function snapshot(){const o={app:'shop-manager',v:1,savedAt:Date.now(),settings:S.settings};COLS.forEach(c=>o[c]=[...S[c].values()]);return o}
function saveLocal(){if(mode!=='local')return;clearTimeout(saveLocal.t);saveLocal.t=setTimeout(saveNow,250)}
function saveNow(){clearTimeout(saveLocal.t);saveLocal.t=null;const s=JSON.stringify(snapshot());try{if(NATIVE)NATIVE.save(s);else localStorage.setItem('eshop_v1',s)}catch(e){toast('Could not save data on phone')}}
window.addEventListener('pagehide',()=>{if(saveLocal.t)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveLocal.t)saveNow()});
function applyData(d){COLS.forEach(c=>{S[c]=new Map();(d[c]||[]).forEach(x=>S[c].set(x.id,x))});S.settings={...DEFAULTS,...(d.settings||{})}}
function loadLocal(){try{const raw=NATIVE?NATIVE.load():localStorage.getItem('eshop_v1');const d=JSON.parse(raw||'null');if(d)applyData(d)}catch(e){}}
function writeErr(e){const c=e&&e.code;
  if(c==='invalid_argument')toast('You have view-only access — ask the owner to make you a Contributor.');
  else if(c==='quota_exceeded')toast('Storage is full — export reports and clear old data.');
  else toast('Could not save ('+(c||'error')+') — check your internet');}
function put(col,obj){
  if(!obj.id)obj.id=uid();
  S[col].set(obj.id,obj);
  if(mode==='cloud'){const{id,...body}=obj;const b=clean(body);queue(col+'/'+id,()=>db.collection(col).doc(id).set(b)).catch(writeErr)}else saveLocal();
  scheduleRender();return obj;
}
function del(col,id){S[col].delete(id);if(mode==='cloud')queue(col+'/'+id,()=>db.collection(col).doc(id).delete()).catch(writeErr);else saveLocal();scheduleRender()}
function putSettings(s){S.settings={...DEFAULTS,...s};if(mode==='cloud')queue('config/settings',()=>db.doc('config/settings').set(clean(S.settings))).catch(writeErr);else saveLocal();scheduleRender()}
async function fetchWhere(col,filters){
  if(mode!=='cloud')return[...S[col].values()].filter(x=>filters.every(([f,op,v])=>op==='=='?x[f]===v:op==='>='?x[f]>=v:op==='<='?x[f]<=v:true));
  let q=db.collection(col);filters.forEach(f=>q=q.where(...f));
  const s=await q.get();const out=s.docs.map(d=>({...d.data(),id:d.id}));
  out.forEach(x=>{if(!S[col].has(x.id))S[col].set(x.id,x)});return out;
}
function listen(name,q){
  q.onSnapshot(snap=>{
    subs[name]=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
    const col=name.split(':')[0];const m=new Map();
    Object.keys(subs).filter(k=>k.startsWith(col+':')).forEach(k=>subs[k].forEach((v,id)=>m.set(id,v)));
    S[col]=m;if(!snap.metadata.fromCache)loaded();scheduleRender();
  },e=>{loaded();setSync('local','Sync stopped ('+e.code+')')});
}
let loadTimer=null;
function loaded(){if(loadTimer){clearTimeout(loadTimer);loadTimer=null;setSync('live','Live sync')}}
function setSync(cls,txt){const s=$('#sync');s.className='sync '+cls;s.innerHTML='<i></i><span>'+esc(txt)+'</span>'}
async function init(){
  window.addEventListener('hashchange',scheduleRender);
  try{cart={...cart,...JSON.parse(localStorage.getItem('eshop_cart')||'{}')}}catch(e){}
  scheduleRender();
  if(NATIVE){mode='local';loadLocal();downloads={save:({filename,data})=>{NATIVE.saveFile(filename,data,/\.csv$/.test(filename)?'text/csv':'text/html');return Promise.resolve()}};setSync('local','On this phone');scheduleRender();return}
  let d=null,dl=null;
  try{if(window.claude&&claude.use)[d,dl]=await Promise.all([claude.use('db').catch(()=>null),claude.use('downloads').catch(()=>null)])}catch(e){}
  downloads=dl;
  if(!d){mode='local';loadLocal();setSync('local','This device only');scheduleRender();return}
  db=d;mode='cloud';setSync('','Connecting…');
  loadTimer=setTimeout(()=>{loadTimer=null;setSync('local','Can’t reach server yet')},10000);
  const t=dayKey();
  listen('products:all',db.collection('products'));
  listen('customers:all',db.collection('customers'));
  listen('bills:recent',db.collection('bills').where('day','>=',addDays(t,-1)));
  listen('repairs:open',db.collection('repairs').where('status','!=','delivered'));
  listen('repairs:recent',db.collection('repairs').where('day','>=',addDays(t,-30)));
  listen('ledger:recent',db.collection('ledger').where('day','>=',addDays(t,-1)));
  db.doc('config/settings').onSnapshot(s=>{S.settings={...DEFAULTS,...(s.exists?s.data():{})};scheduleRender()},()=>{});
}

/* ---------- derived ---------- */
const products=()=>[...S.products.values()].sort((a,b)=>(a.cat||'').localeCompare(b.cat||'')||(a.name||'').localeCompare(b.name||''));
const cats=()=>[...new Set(products().map(p=>p.cat||'Other'))];
const lowStock=()=>products().filter(p=>!p.service&&(+p.stock||0)<=(+p.min||0));
const customers=()=>[...S.customers.values()].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const dues=()=>customers().filter(c=>(c.balance||0)>0.5).sort((a,b)=>b.balance-a.balance);
const todayBills=()=>[...S.bills.values()].filter(b=>b.day===dayKey());
const todayLedger=()=>[...S.ledger.values()].filter(l=>l.day===dayKey());
const openRepairs=()=>[...S.repairs.values()].filter(r=>r.status!=='delivered').sort((a,b)=>a.ts-b.ts);
function nextNo(list,prefix){const seq=Math.max(0,...list.map(x=>x.seq||0))+1;return{seq,no:prefix+dayKey().replace(/-/g,'').slice(2)+'-'+pad(seq)}}

/* ---------- cart ---------- */
let cart={items:[],custId:null,disc:0};
const pos={cat:'All',q:'',tab:'menu'};
function saveCart(){try{localStorage.setItem('eshop_cart',JSON.stringify(cart))}catch(e){}}
function cartCalc(c=cart){
  const sub=c.items.reduce((a,i)=>a+i.price*i.qty,0);
  const disc=Math.min(Math.max(+c.disc||0,0),sub);
  const raw=sub-disc,total=Math.round(raw);
  const f=sub?raw/sub:0;const tax={};
  c.items.forEach(i=>{const g=+i.gst||0;if(!g)return;const amt=i.price*i.qty*f;const taxable=amt/(1+g/100);tax[g]=tax[g]||{taxable:0,gst:0};tax[g].taxable+=taxable;tax[g].gst+=amt-taxable});
  return{sub,disc,round:total-raw,total,tax,qty:c.items.length};
}
function addToCart(pid){const p=S.products.get(pid);if(!p)return;const f=cart.items.find(i=>i.pid===pid);
  if(f)f.qty=r2(f.qty+1);else cart.items.push({pid,name:p.name,price:+p.price,cost:+p.cost||0,gst:+p.gst||0,unit:p.unit||'pc',qty:1});
  saveCart();renderPOS()}
function chQty(ix,d){const it=cart.items[ix];if(!it)return;it.qty=r2(it.qty+d);if(it.qty<=0)cart.items.splice(ix,1);saveCart();renderPOS()}

let rq=false,dirty=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;renderAll()})}
const ROUTES=[['home','Home'],['bill','New Bill'],['stock','Stock'],['khata','Udhaar'],['repairs','Repairs'],['reports','Reports'],['setup','Setup']];
const route=()=>{const h=location.hash.slice(1);return ROUTES.some(r=>r[0]===h)||/^cust-/.test(h)?h:'home'};
function renderAll(){
  $('#brandName').textContent=S.settings.name||'Electrical Shop';
  const r=route();
  const ls=lowStock().length,rp=openRepairs().filter(x=>x.status==='ready').length;
  $('#nav').innerHTML=ROUTES.map(([k,l])=>{const b=k==='stock'?ls:k==='repairs'?rp:0;
    return`<a href="#${k}" class="${k==='bill'?'cta':''} ${r===k||(k==='khata'&&r.startsWith('cust-'))?'on':''}">${ico(k)}<span>${l}</span>${b?`<span class="badge">${b}</span>`:''}</a>`}).join('');
  if(r==='bill'){if($('#pos').classList.contains('hidden'))openPOS();else renderPOS();return}
  else if(!$('#pos').classList.contains('hidden'))$('#pos').classList.add('hidden');
  const a=document.activeElement;
  if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){dirty=true;return}
  dirty=false;
  const v=r.startsWith('cust-')?vCustomer(r.slice(5)):({home:vHome,stock:vStock,khata:vKhata,repairs:vRepairs,reports:vReports,setup:vSetup}[r])();
  $('#view').innerHTML=v;
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty)scheduleRender()},50));

const custCache={};
function vCustomer(id){

  <table><tr style="font-weight:700"><td>Item</td><td class="n">Qty</td><td class="n">Rate</td><td class="n">Amt</td></tr>${b.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="n">${fq(i.qty)} ${esc(i.unit||'')}</td><td class="n">${inr2(i.price)}</td><td class="n">${inr2(i.price*i.qty)}</td></tr>`).join('')}</table><hr>

  <tr><td>Paid (${esc(b.pay==='Udhaar'||b.pay==='Part'?b.payMode||'Cash':b.pay)})</td><td class="n">${inr2(b.paid)}</td></tr>${b.due?`<tr style="font-weight:700"><td>Balance (udhaar)</td><td class="n">${inr2(b.due)}</td></tr>`:''}</table>
  ${s.gstin&&b.tax&&Object.keys(b.tax).length?`<hr><table><tr style="font-weight:700"><td>GST</td><td class="n">Taxable</td><td class="n">CGST</td><td class="n">SGST</td></tr>${Object.entries(b.tax).map(([g,v])=>`<tr><td>${g}%</td><td class="n">${inr2(v.taxable)}</td><td class="n">${inr2(v.gst/2)}</td><td class="n">${inr2(v.gst/2)}</td></tr>`).join('')}</table><div style="font-size:11px">Prices inclusive of GST</div>`:''}
  <hr><div class="c">${s.upi?'UPI: '+esc(s.upi)+'<br>':''}${esc(s.footer)}</div></div>`}
function receiptText(b){const s=S.settings;const L=['*'+s.name+'*'];if(s.address)L.push(s.address);L.push('Bill '+b.billNo+' · '+dt(b.ts),'');
  b.items.forEach(i=>L.push(`${fq(i.qty)} ${i.unit} ${i.name} — ₹${inr2(i.price*i.qty)}`));L.push('');if(b.disc)L.push('Discount: -₹'+inr2(b.disc));
  L.push('*Total: ₹'+inr2(b.total)+'*','Paid: ₹'+inr2(b.paid));if(b.due)L.push('Baaki (udhaar): ₹'+inr2(b.due));if(s.upi)L.push('UPI: '+s.upi);L.push('',s.footer);return L.join('\n')}
function showBill(id){const b=S.bills.get(id)||(rep.res&&rep.res.bills.find(x=>x.id===id));

  const wa=`https://wa.me/${phoneWA(b.custPhone)}?text=${encodeURIComponent(receiptText(b))}`;

async function copyText(t){if(NATIVE){NATIVE.copy(t);return toast('Copied')}try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){toast('Copy not allowed here')}}
async function saveFile(filename,data){if(!downloads)return toast('Downloads not available here');try{await downloads.save({filename,data})}catch(e){toast('Download was not saved')}}

function adjBal(custId,delta){const c=S.customers.get(custId);if(!c)return;put('customers',{...c,balance:r2((c.balance||0)+delta),lastTxn:Date.now()})}
function finalizeBill({items,custId,disc,pay,paid,kind,repairId,payMode}){
  const c=cartCalc({items,disc});const cu=custId&&S.customers.get(custId);
  paid=Math.min(Math.max(+paid||0,0),c.total);const due=r2(c.total-paid);
  const n=nextNo(todayBills(),'');
  const profit=items.reduce((a,i)=>a+(i.price-(i.cost||0))*i.qty,0)-c.disc;
  const b=put('bills',{billNo:n.no,seq:n.seq,day:dayKey(),ts:Date.now(),items:items.map(i=>({...i})),sub:c.sub,disc:c.disc,round:c.round,total:c.total,tax:c.tax,paid,due,pay,payMode:payMode||null,profit,
    custId:custId||null,custName:cu?cu.name:'',custPhone:cu?cu.phone||'':'',kind:kind||'sale',repairId:repairId||null});
  items.forEach(i=>{if(!i.pid)return;const p=S.products.get(i.pid);if(p&&!p.service)put('products',{...p,stock:r2((+p.stock||0)-i.qty)})});
  if(due>0&&custId){adjBal(custId,due);put('ledger',{custId,type:'bill',amount:due,billId:b.id,billNo:b.billNo,ts:b.ts,day:b.day,note:items.map(i=>i.name).slice(0,3).join(', ')})}
  return b;
}

const SAMPLE=[
 ['Lighting',[['LED Bulb 9W',99,65,40],['LED Bulb 12W',139,92,30],['LED Tube Light 20W',299,210,15],['Batten Holder',35,22,25],['Pendant Holder',25,15,30]]],
 ['Wires & Cables',[['Wire 1.0 sq mm',12,8.5,900,'m'],['Wire 1.5 sq mm',18,13,900,'m'],['Wire 2.5 sq mm',28,21,500,'m'],['Flexible Wire 0.75 sq mm',9,6,500,'m'],['PVC Insulation Tape',15,9,50]]],
 ['Switches & Sockets',[['Switch 6A',25,16,60],['Socket 6A 3-pin',35,22,40],['Switch 16A',55,36,25],['Socket 16A',75,50,20],['Plug Top 3-pin',30,18,30],['Extension Board 4-socket',249,170,10],['Switch Board 4-module',60,38,15]]],
 ['MCB & Fuse',[['MCB 16A Single Pole',189,130,12],['MCB 32A Single Pole',229,160,8],['Kit-Kat Fuse 32A',60,38,10],['Fuse Wire (roll)',20,12,20]]],
 ['Fans',[['Ceiling Fan 1200mm',1650,1300,4],['Table Fan 400mm',1350,1050,3],['Fan Capacitor 2.5 mfd',45,25,30],['Fan Regulator',120,75,15]]],
 ['Others',[['AA Battery (pair)',30,20,40],['LED Torch',150,100,10],['Line Tester',40,22,15],['Mobile Charger',199,120,10]]],
 ['Service',[['Fitting / labour charge',100,0,0,'job',1],['House wiring visit',300,0,0,'job',1]]]];
function loadSample(){if(S.products.size)return;SAMPLE.forEach(([cat,l])=>l.forEach(([name,price,cost,stock,unit,svc])=>put('products',{name,cat,price,cost,stock,unit:unit||'pc',min:svc?0:Math.max(2,Math.round(stock/5)),gst:18,service:!!svc})));toast('Sample stock loaded — edit prices in Stock')}
function runReport(){rep.from=$('#rFrom')?.value||rep.from;rep.to=$('#rTo')?.value||rep.to;if(rep.from>rep.to)[rep.from,rep.to]=[rep.to,rep.from];
  const build=(bills,led)=>{const r={bills:[],total:0,profit:0,repair:0,due:0,coll:0,cash:0,upi:0,tax:{},items:{}};
    bills.filter(b=>b.day>=rep.from&&b.day<=rep.to).sort((a,b)=>b.ts-a.ts).forEach(b=>{r.bills.push(b);r.total+=b.total;r.profit+=b.profit||0;r.due+=b.due||0;if(b.kind==='repair')r.repair+=b.total;
      if((b.pay==='UPI')||(b.payMode==='UPI'))r.upi+=b.paid;else r.cash+=b.paid;
      Object.entries(b.tax||{}).forEach(([g,v])=>{const t=r.tax[g]||(r.tax[g]={taxable:0,gst:0});t.taxable+=v.taxable;t.gst+=v.gst});
      b.items.forEach(i=>{const x=r.items[i.name]||(r.items[i.name]={qty:0,amt:0});x.qty+=i.qty;x.amt+=i.qty*i.price})});
    led.filter(l=>l.type==='pay'&&l.day>=rep.from&&l.day<=rep.to).forEach(l=>r.coll+=l.amount);return r};
  if(mode!=='cloud'){rep.res=build([...S.bills.values()],[...S.ledger.values()]);scheduleRender();return}
  rep.busy=true;scheduleRender();
  const f=[['day','>=',rep.from],['day','<=',rep.to]];
  Promise.all([fetchWhere('bills',f),fetchWhere('ledger',f)]).then(([b,l])=>{rep.res=build(b,l)}).catch(e=>toast('Could not load ('+(e.code||'error')+')')).finally(()=>{rep.busy=false;scheduleRender()})}
function repCsv(){const r=rep.res;const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Bill No','Date','Time','Customer','Items','Subtotal','Discount','Total','Paid','Udhaar','Payment','Profit']];
  r.bills.forEach(b=>rows.push([b.billNo,b.day,tm(b.ts),b.custName||'Walk-in',b.items.map(i=>fq(i.qty)+' '+i.unit+' '+i.name).join('; '),r2(b.sub),r2(b.disc),b.total,r2(b.paid),r2(b.due),b.pay,r2(b.profit)]));
  saveFile(`sales_${rep.from}_to_${rep.to}.csv`,rows.map(x=>x.map(q).join(',')).join('\n'))}

/* ---------- actions ---------- */
const ACT={
 go:d=>location.hash=d.to,
 sample:()=>loadSample(),
 pcat:d=>{pos.cat=d.c;renderPOS()},ptab:d=>{pos.tab=d.t;renderPOS()},
 add:d=>addToCart(d.id),inc:d=>chQty(+d.i,1),dec:d=>chQty(+d.i,-1),
 clearCart:()=>{cart={items:[],custId:null,disc:0};saveCart();renderPOS()},
 editLine:d=>{const i=cart.items[+d.i];modal(`<h2>${esc(i.name)}</h2><form id="lineF" class="fg" data-i="${d.i}"><label class="f">Quantity (${esc(i.unit)})<input class="in" name="qty" type="number" step="0.01" min="0" value="${i.qty}" autofocus></label><label class="f">Rate ₹ per ${esc(i.unit)}<input class="in" name="price" type="number" step="0.01" min="0" value="${i.price}"></label><div class="mfoot full"><button type="button" class="btn ghost danger" data-act="lineDel" data-i="${d.i}" style="margin-right:auto">Remove</button><button type="button" class="btn" data-act="mclose">Cancel</button><button class="btn p">Update</button></div></form>`)},
 lineDel:d=>{cart.items.splice(+d.i,1);saveCart();closeModal();renderPOS()},
 customItem:()=>modal(`<h2>Other item</h2><p class="sub">For something not in your stock list.</p><form id="customF" class="fg"><label class="f full">Item name<input class="in" name="name" required autofocus></label><label class="f">Quantity<input class="in" name="qty" type="number" step="0.01" min="0.01" value="1"></label><label class="f">Rate ₹<input class="in" name="price" type="number" step="0.01" min="0" required></label><div class="mfoot full"><button type="button" class="btn" data-act="mclose">Cancel</button><button class="btn p">Add to bill</button></div></form>`),
 disc:()=>modal(`<h2>Discount</h2><form id="discF"><label class="f">Discount amount ₹<input class="in" name="disc" type="number" step="0.5" min="0" value="${cart.disc||''}" autofocus></label><div class="mfoot"><button type="button" class="btn ghost" data-act="discClear">Remove</button><button type="button" class="btn" data-act="mclose">Cancel</button><button class="btn p">Apply</button></div></form>`),
 discClear:()=>{cart.disc=0;saveCart();closeModal();renderPOS()},
 pickCust:()=>pickCust(),
 custPick:d=>{cart.custId=d.id;saveCart();closeModal();renderPOS();resumeCheckout()},
 custNewPick:()=>custForm(null,id=>{cart.custId=id;saveCart();renderPOS();resumeCheckout()}),
 clearCust:()=>{cart.custId=null;saveCart();renderPOS()},
 newBillFor:d=>{cart.custId=d.id;saveCart();location.hash='bill'},
 checkout:()=>checkoutForm(),
 pmode:(d,el)=>{pay.mode=d.p;if(el)el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));const c=cartCalc();
   const inp=$('#paidIn');if(inp)inp.value=d.p==='Udhaar'?0:c.total;const nc=$('#needCust');if(nc)nc.classList.toggle('hidden',d.p!=='Udhaar');payNote()},
 doCheckout:()=>{const c=cartCalc();let paid=+($('#paidIn')?.value||0);
   if(pay.mode!=='Udhaar'&&paid<c.total)return toast('Amount is less than total — choose Udhaar / Part');
   if(pay.mode==='Udhaar'&&!cart.custId){ACT._resumeCheckout=true;ACT._resumePaid=paid;return pickCust()}
   const p=pay.mode==='Udhaar'?(paid>0?'Part':'Udhaar'):pay.mode;
   const b=finalizeBill({items:cart.items,custId:cart.custId,disc:cart.disc,pay:p,paid:Math.min(paid,c.total),payMode:pay.mode==='Udhaar'?'Cash':null});
   cart={items:[],custId:null,disc:0};saveCart();closeModal();renderPOS();showBill(b.id);toast('Bill saved · '+b.billNo)},
 bill:d=>showBill(d.id),
 copyBill:d=>{const b=S.bills.get(d.id)||rep.res?.bills.find(x=>x.id===d.id);copyText(receiptText(b))},
 dlBill:d=>{const b=S.bills.get(d.id)||rep.res?.bills.find(x=>x.id===d.id);saveFile(`bill_${b.billNo}.html`,billFile(b))},
 prodForm:d=>prodForm(d.id),prodDel:d=>{del('products',d.id);closeModal()},
 stockIn:d=>stockInForm(d.id),
 stockCat:d=>{stockCat=d.c;scheduleRender()},
 custForm:d=>custForm(d.id),
 payForm:d=>payForm(d.id),
 repForm:()=>repForm(),repEdit:d=>repForm(d.id),repView:d=>repView(d.id),
 repF:d=>{repFilter=d.f;scheduleRender()},
 repSt:d=>{const r=S.repairs.get(d.id);put('repairs',{...r,status:d.s,[d.s+'At']:Date.now()});repView(d.id)},
 repDeliver:d=>repDeliverForm(d.id),
 rq:d=>{const t=dayKey();if(d.q==='today')rep.from=rep.to=t;else if(d.q==='7'){rep.from=addDays(t,-6);rep.to=t}else{rep.from=t.slice(0,8)+'01';rep.to=t}const f=$('#rFrom'),g=$('#rTo');if(f)f.value=rep.from;if(g)g.value=rep.to;runReport()},
 runRep:()=>runReport(),repCsv:()=>repCsv(),
 repCopy:()=>{const r=rep.res;copyText(`${S.settings.name} — ${prettyDay(rep.from)}${rep.from!==rep.to?' to '+prettyDay(rep.to):''}\nSales: ₹${inr2(r.total)} (${r.bills.length} bills)\nProfit: ₹${inr2(r.profit)}\nCash: ₹${inr2(r.cash)} · UPI: ₹${inr2(r.upi)}\nUdhaar given: ₹${inr2(r.due)} · collected: ₹${inr2(r.coll)}`)},
 saveSetup:()=>{const v=s=>$(s).value.trim();putSettings({...S.settings,name:v('#sName')||'My Electrical Shop',address:v('#sAddr'),phone:v('#sPhone'),gstin:v('#sGst').toUpperCase(),upi:v('#sUpi'),footer:v('#sFoot')});document.activeElement?.blur();toast('Saved')},
 mclose:()=>closeModal(),
 printBill:d=>{const b=S.bills.get(d.id)||rep.res?.bills.find(x=>x.id===d.id);NATIVE.printHtml(billFile(b,false),'Bill '+b.billNo)},
 driveConnect:()=>{saveNow();NATIVE.connectDrive()},
 driveBackup:()=>{saveNow();NATIVE.backupNow()},
 driveRestore:()=>{saveNow();NATIVE.restore()},
 doRestore:()=>{const d=window.__pendingRestore;window.__pendingRestore=null;closeModal();if(!d)return;applyData(d);saveNow();cart={items:[],custId:null,disc:0};saveCart();location.hash='home';scheduleRender();toast('Backup restored')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el,e)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=Object.fromEntries(new FormData(f));const id=f.dataset.id;
  if(f.id==='prodF'){put('products',{...(id?S.products.get(id):{}),id:id||undefined,name:fd.name.trim(),cat:fd.cat.trim()||'Other',unit:fd.unit,price:+fd.price||0,cost:+fd.cost||0,stock:+fd.stock||0,min:+fd.min||0,gst:+fd.gst||0,service:fd.service==='1'});closeModal();toast('Saved')}
  else if(f.id==='stockF'){const p=S.products.get(fd.pid);put('products',{...p,stock:r2((+p.stock||0)+(+fd.qty)),cost:fd.cost?+fd.cost:p.cost});closeModal();toast(`${p.name}: +${fq(+fd.qty)} ${p.unit||'pc'}`)}
  else if(f.id==='custF'){const old=id?S.customers.get(id):{balance:0,created:Date.now()};const op=+fd.opening||0;
    const c=put('customers',{...old,id:id||undefined,name:fd.name.trim(),phone:fd.phone.trim(),village:fd.village.trim(),balance:r2((old.balance||0)+op)});
    if(op>0)put('ledger',{custId:c.id,type:'bill',amount:op,ts:Date.now(),day:dayKey(),note:'Old balance (opening)'});
    closeModal();const a=custForm.after;custForm.after=null;if(a)a(c.id);toast('Customer saved')}
  else if(f.id==='payF'){const amt=r2(+fd.amount);if(!(amt>0))return;put('ledger',{custId:fd.custId,type:'pay',amount:amt,mode:fd.mode,note:fd.note.trim(),ts:Date.now(),day:dayKey()});adjBal(fd.custId,-amt);closeModal();toast('Payment of '+inr(amt)+' saved')}
  else if(f.id==='lineF'){const i=cart.items[+f.dataset.i];i.qty=r2(+fd.qty);i.price=r2(+fd.price);if(i.qty<=0)cart.items.splice(+f.dataset.i,1);saveCart();closeModal();renderPOS()}
  else if(f.id==='customF'){cart.items.push({pid:null,name:fd.name.trim(),qty:r2(+fd.qty||1),price:r2(+fd.price||0),cost:0,gst:0,unit:'pc'});saveCart();closeModal();renderPOS()}
  else if(f.id==='discF'){cart.disc=Math.max(0,+fd.disc||0);saveCart();closeModal();renderPOS()}
  else if(f.id==='repF'){const old=id?S.repairs.get(id):(()=>{const n=nextNo([...S.repairs.values()].filter(r=>r.day===dayKey()),'R');return{no:n.no,seq:n.seq,day:dayKey(),ts:Date.now(),status:'received'}})();
    put('repairs',{...old,id:id||undefined,custName:fd.custName.trim(),phone:fd.phone.trim(),item:fd.item.trim(),problem:fd.problem.trim(),estimate:+fd.estimate||0,advance:+fd.advance||0,promise:fd.promise});closeModal();toast(id?'Job updated':'Job '+old.no+' created')}
  else if(f.id==='delF'){const r=S.repairs.get(id);const items=[{pid:null,name:'Repair: '+r.item+(r.problem?' ('+r.problem+')':''),qty:1,price:+fd.charge||0,cost:0,gst:0,unit:'job'}];
    if(fd.part){const p=S.products.get(fd.part);items.push({pid:p.id,name:p.name,qty:1,price:+p.price,cost:+p.cost||0,gst:+p.gst||0,unit:p.unit||'pc'})}
    const total=Math.round(items.reduce((a,i)=>a+i.price*i.qty,0));const adv=Math.min(+fd.advance||0,total);
    let custId=null;if(fd.mode==='Udhaar'){let c=customers().find(c=>r.phone&&c.phone===r.phone)||customers().find(c=>c.name.toLowerCase()===r.custName.toLowerCase());if(!c)c=put('customers',{name:r.custName,phone:r.phone||'',village:'',balance:0,created:Date.now()});custId=c.id}
    else{const c=customers().find(c=>r.phone&&c.phone===r.phone);custId=c?c.id:null}
    const paid=fd.mode==='Udhaar'?adv:total;
    const b=finalizeBill({items,custId,disc:0,pay:fd.mode==='Udhaar'?(paid>0?'Part':'Udhaar'):fd.mode,paid,kind:'repair',repairId:r.id,payMode:fd.mode==='Udhaar'?'Cash':null});
    if(!custId){b.custName=r.custName;b.custPhone=r.phone||'';put('bills',b)}
    put('repairs',{...r,status:'delivered',deliveredAt:Date.now(),charge:total,billId:b.id});closeModal();showBill(b.id)}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='pq'){pos.q=t.value;renderPOSItems()}
  else if(t.id==='cq')renderCustList(t.value);
  else if(t.id==='paidIn')payNote();
  else if(t.id==='stockQ'){stockQ=t.value;clearTimeout(ACT._sq);ACT._sq=setTimeout(()=>{const p=t.selectionStart;dirty=false;$('#view').innerHTML=vStock();const n=$('#stockQ');n.focus();n.setSelectionRange(p,p)},150)}
  else if(t.id==='khQ'){khQ=t.value;clearTimeout(ACT._kq);ACT._kq=setTimeout(()=>{const p=t.selectionStart;dirty=false;$('#view').innerHTML=vKhata();const n=$('#khQ');n.focus();n.setSelectionRange(p,p)},150)}
});
document.addEventListener('change',e=>{if(e.target.id==='rFrom')rep.from=e.target.value;if(e.target.id==='rTo')rep.to=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal()});
window.__native=(type,msg)=>{if(msg)toast(msg);scheduleRender()};
window.__restore=text=>{let d;try{d=JSON.parse(text)}catch(e){return toast('That file is not a shop backup')}
  if(!d||!Array.isArray(d.products)||!Array.isArray(d.bills))return toast('That file is not a shop backup');
  window.__pendingRestore=d;
  modal(`<h2>Restore this backup?</h2><p class="m" style="line-height:1.6">Backup from <b>${d.savedAt?dt(d.savedAt)+' '+tm(d.savedAt):'unknown date'}</b>: ${d.products.length} items, ${d.bills.length} bills, ${(d.customers||[]).length} customers.<br><b style="color:var(--bad)">All data now on this phone will be replaced.</b></p><div class="mfoot"><button class="btn" data-act="mclose">Cancel</button><button class="btn p" data-act="doRestore">Replace & restore</button></div>`)};
window.__back=()=>{if(!$('#modal').classList.contains('hidden')){closeModal();return true}const r=route();if(r.startsWith('cust-')){location.hash='khata';return true}if(r!=='home'){location.hash='home';return true}return false};
init();
</script>
