name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ShopManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShopManager-APK
          path: ShopManager.apk

      - name: Publish as the "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ShopManager.apk \
            --title "Shop Manager (build ${{ github.run_number }})" \
            --notes "Tap ShopManager.apk below to download, then open it on your Android phone to install. Built from commit ${GITHUB_SHA::7}."
